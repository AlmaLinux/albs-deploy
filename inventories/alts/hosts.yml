---
all:
  children:
    rabbitmq:
      hosts:
        rabbitmq01:
    scheduler:
      hosts:
        scheduler01:
    celery:
      children:
        celery_x86_64:
          hosts:
            x86_64-node01:
      hosts:
        x86_64-node01:
          celery_queues:
            - "docker-x86_64-0"
            # AlmaLinux 10 x86_64 tasks (queue_arch_overrides in
            # group_vars/scheduler.yml), only for x86-64-v3 capable CPUs
            - "docker-x86_64_v3-0"
        aarch64-node01:
          terraform_arch: arm
          celery_queues:
            - "docker-aarch64-0"
          build_terraform: true
          node_arch: aarch64
          terraform_build_ver: v1.12.1
          docker_build_ver: 4.6.0
        s390x-node01:
          celery_queues:
            - "docker-s390x-0"
          build_terraform: true
          node_arch: s390x
          terraform_build_ver: v1.12.1
          docker_build_ver: 4.6.0
