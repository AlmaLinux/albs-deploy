---
# Three environments. Run one at a time with --limit, e.g.:
#   ansible-playbook -i inventories/pulp playbooks/pulp.yml --limit dev
#   ansible-playbook -i inventories/pulp playbooks/pulp.yml --limit staging --ask-vault-pass
#   ansible-playbook -i inventories/pulp playbooks/pulp.yml --limit prod --ask-vault-pass
#
# Replace the placeholder hosts below with your own (SSH user needs
# passwordless sudo, or run with --ask-become-pass).
#
# All environments share the `pulp` role/play. Group is pulp_all, not pulp: a
# host named `pulp` would make a pattern matching both resolve to the HOST,
# silently reducing any --limit to that one machine.
all:
  children:
    pulp_all:
      children:
        # Dev — PostgreSQL runs in a container (see group_vars/dev.yml).
        dev:
          hosts:
            localhost:
              ansible_connection: local
        # Staging — self-contained, containerized PostgreSQL (see group_vars/staging.yml).
        staging:
          hosts:
            pulp-staging01:
        # Prod — external PostgreSQL on AWS RDS (see group_vars/prod.yml).
        prod:
          hosts:
            pulp-prod01:
