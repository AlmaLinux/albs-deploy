---
# The service user and the GnuPG keyring (the `gpg_keys` fact used below) are
# provisioned by the sign_common role, which must run before this one.

- name: Remove venv if exists
  file:
    path: "{{ sign_node_venv_directory }}"
    state: absent
  become: "yes"

- name: Create subsequent directories
  become_user: "{{ service_user }}"
  become: "yes"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
  with_items: "{{ working_directories }}"

- name: Generate sign node config
  become_user: "{{ service_user }}"
  become: "yes"
  template:
    src: sign_node.yml.j2
    dest: "{{ final_conf_dir }}/sign_node.yml"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: "0644"
    backup: yes

- name: Clone sign node repository
  become_user: "{{ service_user }}"
  become: "yes"
  git:
    repo: https://github.com/AlmaLinux/albs-sign-node.git
    dest: "{{ sign_node_working_directory }}/albs-sign-node"
    clone: yes
    update: yes
    accept_hostkey: yes
    force: yes

- name: Upgrade pip
  become: yes
  become_user: "{{ service_user }}"
  pip:
    name: pip
    state: latest
    virtualenv: "{{ sign_node_venv_directory }}"

# Isolated venv (no system site-packages): the system google.* package would
# otherwise shadow the venv's namespaced google.protobuf (pulled in by
# immudb_wrapper -> immudb-py), breaking sign-node startup.
- name: Create venv
  become: yes
  become_user: "{{ service_user }}"
  pip:
    virtualenv: "{{ sign_node_venv_directory }}"
    virtualenv_command: "python3 -m venv"
    requirements: "{{ sign_node_requirements_path }}"

- name: Install pycurl in venv
  become: yes
  become_user: "{{ service_user }}"
  pip:
    name:
      - pycurl
      - rpm
    virtualenv: "{{ sign_node_venv_directory }}"

# Reconcile the immudb/protobuf/google stack to prod's known-good versions
# (see sign_node_dep_pins in defaults). requirements.txt pulls these unpinned,
# so this downgrades them to the set that actually imports and signs.
- name: Pin the immudb/protobuf stack to the known-good production versions
  become: yes
  become_user: "{{ service_user }}"
  pip:
    name: "{{ sign_node_dep_pins }}"
    virtualenv: "{{ sign_node_venv_directory }}"
  when: sign_node_dep_pins | length > 0

- name: Add pulp to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ albs_address }} pulp"
    state: present
  become: yes
