---

- name: Install unzip package
  ansible.builtin.yum:
    name: unzip
    state: present
  when: build_terraform is not defined

- name: Get installed Terraform version
  ansible.builtin.command: /usr/local/bin/terraform version -json
  register: terraform_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - always

# Terraform built from source reports its version with a "-dev" suffix
- name: Check whether Terraform needs to be installed
  ansible.builtin.set_fact:
    terraform_install_needed: >-
      {{ terraform_installed.rc != 0
         or ((terraform_installed.stdout | from_json).terraform_version | regex_replace('-dev$', ''))
            != (terraform_build_ver | regex_replace('^v', '') if build_terraform is defined else terraform_version) }}
  tags:
    - always

- name: Check whether the docker provider is already built
  ansible.builtin.stat:
    path: "{{ docker_provider_dir }}/terraform-provider-docker_{{ docker_build_ver }}"
  register: docker_provider_bin
  when: build_terraform is defined
  tags:
    - always

- name: Check whether the docker provider needs to be built
  ansible.builtin.set_fact:
    docker_provider_build_needed: "{{ build_terraform is defined and not docker_provider_bin.stat.exists }}"
  tags:
    - always

- name: Download Terraform
  ansible.builtin.get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ terraform_arch }}.zip"
    dest: /tmp/terraform.zip
  when: build_terraform is not defined and terraform_install_needed | bool

# get_url doesn't download in check mode, so there is nothing to unpack
- name: Unpack Terraform
  ansible.builtin.unarchive:
    src: /tmp/terraform.zip
    dest: /usr/local/bin
    remote_src: yes
  when:
    - build_terraform is not defined
    - terraform_install_needed | bool
    - not ansible_check_mode

- name: Delete archive
  ansible.builtin.file:
    path: /tmp/terraform.zip
    state: absent
  when: build_terraform is not defined and terraform_install_needed | bool

- name: Install golang
  ansible.builtin.yum:
    name: golang
    state: present
  when:
    - build_terraform is defined
    - terraform_install_needed | bool or docker_provider_build_needed | bool
  tags:
    - build-terraform

- name: Clone terraform repository
  ansible.builtin.git:
    repo: https://github.com/hashicorp/terraform.git
    dest: /tmp/terraform
    version: "{{ terraform_build_ver }}"
  when: build_terraform is defined and terraform_install_needed | bool
  tags:
    - build-terraform

- name: Build terraform
  ansible.builtin.shell: |
    cd /tmp/terraform
    GOBIN="/usr/local/bin/" go install .
  environment:
    GOTOOLCHAIN: auto
  when: build_terraform is defined and terraform_install_needed | bool
  tags:
    - build-terraform

- name: Verify terraform installation
  ansible.builtin.command: terraform version
  changed_when: false

- name: Remove terraform git directory
  ansible.builtin.file:
    path: /tmp/terraform
    state: absent
  when: build_terraform is defined and terraform_install_needed | bool
  tags:
    - build-terraform

- name: Clone docker provider
  ansible.builtin.git:
    repo: https://github.com/kreuzwerker/terraform-provider-docker.git
    dest: /tmp/docker-provider
    version: "v{{ docker_build_ver }}"
  when: docker_provider_build_needed | bool
  tags:
    - build-terraform

- name: Prepare dir for docker provider
  ansible.builtin.file:
    path: "{{ docker_provider_dir }}/"
    state: directory
    mode: 0755
    owner: "{{ test_system_user }}"
    group: "{{ test_system_user }}"
  when: docker_provider_build_needed | bool
  tags:
    - build-terraform

- name: Build docker provider
  ansible.builtin.shell: |
    cd /tmp/docker-provider
    go build -o {{ docker_provider_dir }}/terraform-provider-docker_{{ docker_build_ver }}
  environment:
    GOTOOLCHAIN: auto
  when: docker_provider_build_needed | bool
  tags:
    - build-terraform

- name: Change provider ownership and permissions
  ansible.builtin.file:
    path: "{{ docker_provider_dir }}/terraform-provider-docker_{{ docker_build_ver }}"
    mode: 0755
    owner: "{{ test_system_user }}"
    group: "{{ test_system_user }}"
  when: build_terraform is defined and not ansible_check_mode
  tags:
    - build-terraform

- name: Remove docker provider git directory
  ansible.builtin.file:
    path: /tmp/docker-provider
    state: absent
  when: docker_provider_build_needed | bool
  tags:
    - build-terraform

- name: Add Terraform plugin cache directory
  ansible.builtin.file:
    path: "{{ terraform_plugin_cache_dir }}"
    owner: "{{ test_system_user }}"
    group: "{{ test_system_user }}"
    mode: 0755
    state: directory

- name: Create Terraform configuration file
  ansible.builtin.template:
    src: terraformrc.j2
    dest: /home/{{ test_system_user }}/.terraformrc
    owner: "{{ test_system_user }}"
    group: "{{ test_system_user }}"
    mode: 0644
