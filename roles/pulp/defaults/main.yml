---
# ── Layout ──────────────────────────────────────────────────────────────
pulp_project_dir: /opt/pulp
pulp_assets_dir: "{{ pulp_project_dir }}/assets"

# ── Container engine ──────────────────────────────────────────────────────
# Which engine runs the stack: "docker" or "podman". docker uses the daemon +
# "docker compose"; podman is daemonless and uses "podman-compose". Podman runs
# rootful here (the play escalates via sudo), matching the old root Docker
# daemon and keeping privileged ports (80/443) working without extra tuning.
# Overridden per-environment in group_vars (prod uses podman).
pulp_container_engine: docker
pulp_container_cli: "{{ 'podman' if pulp_container_engine == 'podman' else 'docker' }}"
pulp_compose_cmd: "{{ 'podman-compose' if pulp_container_engine == 'podman' else 'docker compose' }}"

# ── Orchestrator ──────────────────────────────────────────────────────────
# How the stack is described and supervised:
#
#   compose  (default) — one rendered compose.yml driven by "docker compose" /
#     "podman-compose". Supports the FULL topology: bundled pulp_web, containerised
#     PostgreSQL, multi-replica api/content behind pulp_web's DNS load balancing.
#     Under podman, boot persistence relies on podman-restart.service (+ the
#     RequiresMountsFor drop-in) because nothing supervises the containers.
#
#   quadlet — one systemd unit per container under {{ pulp_quadlet_dir }} (see
#     vars/main.yml), generated by podman-system-generator. Podman ONLY. Boot
#     persistence, dependency ordering, per-service mount requirements and
#     restart policy all become native systemd, and a config change restarts just
#     the affected services instead of force-recreating every container.
#
#     Covers every service except pulp_web, so it requires (asserted in
#     tasks/main.yml):
#       * pulp_container_engine: podman
#       * pulp_web_enabled: false      — no pulp_web unit; use an external proxy
#     Consequently api/content stay single-instance (published host ports) and no
#     nginx service-name DNS load balancing is involved. Workers still scale by
#     replica count: one rendered unit per pulp_worker_replicas. PostgreSQL
#     follows pulp_postgres_external either way: false renders a pulp-postgres
#     unit (+ pg data volume), true expects a managed database.
pulp_orchestrator: compose

# Startup budget for the one-shot migration unit (Quadlet only). `pulpcore-manager
# migrate` on a large database can run for a long time and systemd's default
# TimeoutStartSec would kill it mid-schema-change.
pulp_quadlet_migration_timeout: 3600

# Enable podman-restart.service so restart=always containers come back after a
# host reboot (podman is daemonless — nothing else re-applies the policy on
# boot). Podman engine + compose orchestrator only; ignored under docker (whose
# daemon handles this) and under quadlet (where each unit is WantedBy a target).
# Set false where an external supervisor (a project systemd unit) owns the
# stack lifecycle.
pulp_podman_restart_service: true

# Host bind-mount source paths the restart-managed containers depend on (any of
# the *_dir stores below that are set; empty ones drop out). podman-restart.service
# only orders itself After=network-online.target, so on a host whose store lives
# on an NFS/EFS bind mount it can start containers before that mount is ready.
# These paths are fed to a RequiresMountsFor drop-in so the service waits for
# (and requires) whatever .mount unit provides them. Empty list => no drop-in.
pulp_podman_bind_mount_paths: "{{ [pulp_storage_dir, pulp_exports_dir, pulp_postgres_data_dir, pulp_redis_data_dir] | select | list }}"

# ── Images ──────────────────────────────────────────────────────────────
# Base images. pulp-minimal carries pulpcore + bundled plugins; pulp-web is
# the nginx front end. Both images are pinned to the same pulpcore release for
# reproducible deployments.
# 3.114.1 across all environments — prod pins the same value explicitly in
# group_vars/prod.yml (kept there deliberately, so a change to this default can
# never move prod by accident).
#
# WARNING: raising this runs `pulpcore-manager migrate` on the next bring-up — a
# real, FORWARD-ONLY schema upgrade you cannot roll back by putting the old image
# back. Snapshot the database first. The bundled plugin set also varies by tag;
# check what a tag ships before deploying it:
#   {{ pulp_container_cli }} run --rm {{ pulp_minimal_image }} pip list | grep pulp
pulp_image_tag: "3.114.1"
pulp_minimal_image: "docker.io/pulp/pulp-minimal:{{ pulp_image_tag }}"
pulp_web_image: "docker.io/pulp/pulp-web:{{ pulp_image_tag }}"
pulp_postgres_image: "docker.io/library/postgres:16"
pulp_redis_image: "docker.io/library/redis:latest"

# ── Plugins / custom image ─────────────────────────────────────────────
pulp_extra_plugins: []
# Build a custom image automatically whenever extra plugins are requested OR the
# vendored source patches are enabled (see below).
pulp_build_custom_image: "{{ (pulp_extra_plugins | length) > 0 or (pulp_source_patches_enabled | bool) }}"
pulp_custom_image_name: "localhost/pulp-custom:latest"

# ── Vendored source patches ──────────────────────────────────────────────
# Overlay locally-patched pulpcore modules onto the image. Each entry in
# pulp_source_patches is a file under roles/pulp/files/ (src) and its
# destination inside the image (dest). Currently carried:
#   export.py     — fixes package file timestamps on export and allows
#                   exporting into an existing directory.
#   datarepair.py — makes repair_7272 / repair_7465 (pulpcore-manager
#                   datarepair-*) load one RepositoryVersion at a time and
#                   stream content ids, so they no longer OOM on repositories
#                   with many versions / huge content_ids arrays.
#
# Each file vendors the WHOLE module, so the set is tightly coupled to ONE
# pulpcore version: on an image bump the upstream files may have changed and
# every copy must be re-derived. pulp_source_patches_pulpcore_version records
# the version the current files match; build_image.yml asserts it equals
# pulp_image_tag and fails the build if they drift — forcing a conscious
# re-check on every version bump.
# Off by default. pulp_source_patches_pulpcore_version matches pulp_image_tag,
# so this can be switched on per-environment (prod does); dev/staging leave it
# off and run plain pulp-minimal.
pulp_source_patches_enabled: false
pulp_source_patches_pulpcore_version: "3.114.1"
# Destination directory inside the image. Interpreter-version pinned — verify
# on a bump:
#   {{ pulp_container_cli }} run --rm {{ pulp_minimal_image }} \
#     python3 -c "import pulpcore.app.tasks.export as m; print(m.__file__)"
pulp_source_patches_site_packages: /usr/local/lib/python3.11/site-packages
pulp_source_patches:
  - src: export.py
    dest: "{{ pulp_source_patches_site_packages }}/pulpcore/app/tasks/export.py"
  - src: datarepair.py
    dest: "{{ pulp_source_patches_site_packages }}/pulpcore/app/tasks/datarepair.py"
# Image the pulp-minimal-based services (api/content/worker/etc.) actually run.
pulp_runtime_image: "{{ pulp_custom_image_name if (pulp_build_custom_image | bool) else pulp_minimal_image }}"

# ── Scaling ─────────────────────────────────────────────────────────────
# api/content replicas are SEPARATE containers load-balanced by pulp_web. When
# pulp_web is disabled (external reverse proxy, see below) their gunicorn ports
# are published on fixed host ports, which cannot fan out to >1 replica — pin
# these to 1 in that mode and scale via pulp_api_workers / pulp_content_workers
# instead. pulp_worker has no port, so it always scales freely by replica count.
pulp_api_replicas: 2
pulp_content_replicas: 2
pulp_worker_replicas: 2

# Gunicorn tuning inside each api/content container (image env knobs). Defaults
# match the pulp-oci-images defaults; raise workers to scale a single instance.
pulp_api_workers: 2
pulp_content_workers: 2
pulp_gunicorn_timeout: 90

# ── Container logging ─────────────────────────────────────────────────────
# Long-running services log via the journald driver: container stdout/stderr
# lands in the host systemd journal, so both "{{ pulp_container_cli }} logs
# <svc>" and journalctl work, and retention is governed centrally by journald
# rather than per-container files. This is the right fit for Podman: its
# json-file/k8s-file driver ignores max-file, so a rotated file keeps only the
# latest slice and older history is lost — journald keeps real history.
#
# Each service gets a STATIC syslog tag (the service name), so scaled replicas
# (pulp_api / pulp_content / pulp_worker → pulp_content_1, _2, …) aggregate
# under one identifier — `journalctl -t pulp_content` — while journald's own
# CONTAINER_NAME field still separates individual replicas. One-shot services
# (migration / password / signing) are left unconfigured; they just exit.
pulp_log_driver: journald

# Optionally manage /etc/systemd/journald.conf so the retention policy is
# codified with the deployment. Off by default — leave the host's existing
# journald config untouched. Only applied when pulp_log_driver == "journald".
# NOTE: these limits are GLOBAL to the whole journal (shared by every service
# and replica), not per-container — size the budget accordingly.
pulp_journald_configure: false
pulp_journald_storage: persistent        # keep logs across reboots (/var/log/journal)
pulp_journald_system_max_use: "2G"       # total on-disk budget for the whole journal
pulp_journald_max_retention_sec: "1month"
pulp_journald_compress: "yes"

# ── OpenTelemetry metrics (optional) ─────────────────────────────────────────
# Enable Pulp's native OpenTelemetry instrumentation. Pulp EXPORTS metrics over
# OTLP to a collector — it does NOT expose a Prometheus scrape endpoint — so
# point pulp_otel_exporter_endpoint at an OpenTelemetry Collector (or an
# OTLP-capable Prometheus).
#
# Mechanism (verified against pulp-minimal:3.114.1): pulpcore settings are
# Dynaconf with ENVVAR_PREFIX "PULP", so PULP_OTEL_ENABLED=true sets
# settings.OTEL_ENABLED, which installs pulpcore.middleware.DjangoMetricsMiddleware.
# The image entrypoints do NOT wrap anything with opentelemetry-instrument — that
# tool is not even in the 3.114.x image; the middleware replaces it.
#
# What you get on 3.114.x:
#   * api.request_duration (ms histogram, service.name "pulp-api") — from
#     OTEL_ENABLED alone. Bucket bounds via the OTEL_PULP_API_HISTOGRAM_BUCKETS
#     setting; skip paths with OTEL_PYTHON_EXCLUDED_URLS.
#   * artifacts.size.counter (Bytes, service.name "pulp-content") — ALSO requires
#     settings.DOMAIN_ENABLED, which this role does not set.
# First export lands after OTEL_METRIC_EXPORT_INTERVAL (default 60s).
#
# Only the OTLP *http* exporter is installed in the image, so
# pulp_otel_exporter_protocol must stay http/protobuf — grpc cannot work.
# NOTE: enabling this without a reachable endpoint just produces exporter
# connection-retry log noise — wire the collector first.
pulp_otel_enabled: false
pulp_otel_exporter_endpoint: "http://otel-collector:4318"
# Keep http/protobuf: the image ships only opentelemetry-exporter-otlp-proto-http.
pulp_otel_exporter_protocol: "http/protobuf"

# ── OpenTelemetry collector (optional, runs alongside the stack) ─────────────
# Render and run a collector next to Pulp, so pulp_otel_exporter_endpoint has
# something to talk to. Rendered for BOTH orchestrators: a compose service under
# compose, an otel-collector.container unit under quadlet.
#
# Nothing in the Pulp stack depends on it — a broken collector must never keep
# Pulp down, and the OTLP exporters retry on their own. Consequently the unit is
# NOT in pulp_quadlet_runtime_after; api/content/worker carry no Requires= on it.
pulp_otel_collector_enabled: false
# Pin the tag. ":latest" breaks configs across collector releases (the "logging"
# exporter was dropped in favour of "debug", for one).
pulp_otel_collector_image: "docker.io/otel/opentelemetry-collector-contrib:0.115.1"
# Container name == the DNS name on the shared network, so it MUST match the host
# part of pulp_otel_exporter_endpoint above. Hyphen, not underscore: underscores
# are invalid in hostnames (RFC 1034/1035) and bite in Host headers.
pulp_otel_collector_name: otel-collector
pulp_otel_collector_otlp_http_port: 4318
pulp_otel_collector_otlp_grpc_port: 4317
# Publish the OTLP ports on the host. Useful on dev to push test spans in from
# outside the container network; leave false elsewhere.
pulp_otel_collector_expose_ports: false
# Serve metrics as a Prometheus SCRAPE endpoint on the collector. This is the
# primary path: Pulp's own processes expose no HTTP endpoint, so the collector is
# the only thing that can be scraped — and pulling this way means Prometheus needs
# NO OTLP receiver enabled (no --web.enable-otlp-receiver, no version floor).
# The port is published on the host whenever this is on, since a scrape endpoint
# only reachable inside the container network is useless. It is unauthenticated:
# restrict it at the firewall/security-group level.
pulp_otel_collector_prometheus_exporter: true
pulp_otel_collector_prometheus_port: 8889

# The collector's OWN telemetry (otelcol_receiver_accepted_metric_points,
# otelcol_exporter_sent_metric_points, otelcol_exporter_send_failed_metric_points).
# Cheap, and the fastest way to tell "Pulp sent nothing" from "the collector
# dropped it" — leave it on. Also published on the host.
pulp_otel_collector_telemetry_enabled: true
pulp_otel_collector_telemetry_port: 8888

# Additionally PUSH metrics to an OTLP endpoint. Independent of the scrape
# exporter above — set both to do both. Empty => push nowhere, i.e.
# metrics are only served for scraping. With neither exporter configured they
# fall back to the debug exporter (printed to the collector's log).
# For an OTLP-capable Prometheus use the BASE OTLP path — the exporter appends
# /v1/metrics itself:
#   http://prometheus.example.com:9090/api/v1/otlp
# Prometheus needs its OTLP receiver switched on (2.47+:
# --enable-feature=otlp-write-receiver, 3.x: --web.enable-otlp-receiver).
pulp_otel_collector_metrics_endpoint: ""
# Traces always terminate at the debug exporter: Prometheus cannot accept them,
# and every collector pipeline needs at least one exporter. Absorbing them here
# is what stops Pulp retrying failed trace exports forever.
pulp_otel_collector_debug_verbosity: normal   # normal | detailed

# ── Reverse proxy (pulp_web) ──────────────────────────────────────────────
# The bundled pulp_web (nginx) container fronts the api/content services: it
# terminates TLS, routes /pulp/content/ -> pulp_content and everything else ->
# pulp_api, load-balances replicas, and serves static/UI. Keep it enabled for a
# self-contained stack.
#
# Set false to run your OWN reverse proxy (e.g. nginx on a separate host)
# straight against the api/content gunicorn ports. When disabled:
#   * the pulp_web container, its nginx assets, and local TLS provisioning are
#     dropped;
#   * pulp_api / pulp_content publish the host ports below for your proxy;
#   * api/content must be replicas: 1 (fixed host port); scale via workers;
#   * your proxy owns TLS (set pulp_https: false) and MUST route /pulp/content/
#     to the content port and the rest to the api port. Because it terminates
#     TLS, set CONTENT_ORIGIN (pulp_content_origin) to the public https URL so
#     Pulp emits correct links.
pulp_web_enabled: true
# Host ports published for an external reverse proxy (only when pulp_web is
# disabled). Match your proxy's upstream targets.
pulp_api_host_port: 8081       # -> container 24817 (gunicorn pulp-api)
pulp_content_host_port: 24816  # -> container 24816 (gunicorn pulp-content)

# ── Networking ──────────────────────────────────────────────────────────
# Host-published ports for pulp_web. For production behind privileged ports,
# set these to 80 / 443 (the container listens internally on pulp_web_*_listen
# below). Unused when pulp_web is disabled.
pulp_http_port: 8080
pulp_https_port: 8443
# Internal ports nginx listens on inside the pulp_web container.
pulp_web_http_listen: 8080
pulp_web_https_listen: 8443
# Expose postgres/redis on the host? Off by default (kept inside the compose network).
pulp_expose_postgres: false
pulp_expose_redis: false

# ── HTTPS / TLS ───────────────────────────────────────────────────────────
pulp_https: false
# When HTTPS is on, also serve a plain-HTTP vhost that 301-redirects to HTTPS.
pulp_web_http_redirect: true
# Certificate source (control-node paths). If set, they are copied into place.
pulp_tls_cert_src: ""
pulp_tls_key_src: ""
# If no cert is provided, optionally generate a self-signed one (NON-PRODUCTION).
pulp_tls_generate_self_signed: false
pulp_tls_cn: "{{ ansible_fqdn }}"
# Where the webserver cert/key live on the host (mounted into pulp_web only).
pulp_web_certs_dir: "{{ pulp_assets_dir }}/web/certs"

# ── SELinux relabeling ───────────────────────────────────────────────────────
# Master switch for the ":z"/":Z" relabel flags on ALL bind mounts (config
# assets, certs, and the postgres/redis/storage/exports data mounts). The flag
# makes the engine chcon the host path to a container-accessible label.
#
# Keep true on a LOCAL filesystem under ENFORCING SELinux. Set false when:
#   * SELinux is Permissive/Disabled — labels aren't enforced, so the relabel is
#     dead work (and still recursively walks/chcons the tree on every start), or
#   * the host doesn't use SELinux at all.
# Named-volume mounts never get a relabel flag regardless of this setting.
# NOTE: if the host is later switched back to Enforcing, containers will be
# denied access to unlabeled bind mounts — flip this back true and re-run.
pulp_selinux_relabel: true

# ── Data mount points ──────────────────────────────────────────────────────
# Each store defaults to a managed Docker named volume (empty string). Set a
# host path to bind-mount existing data instead — this is the migration path
# from the systemd deployment (point these at your current data directories).
#   e.g. pulp_storage_dir: /srv/pulp        (current /var/lib/pulp content)
#        pulp_postgres_data_dir: /var/lib/pgsql/data
pulp_storage_dir: ""        # -> pulp_storage_mount   (else named volume "pulp")
pulp_postgres_data_dir: ""  # -> postgres PGDATA      (else named volume "pg_data")
pulp_redis_data_dir: ""     # -> /data                (else named volume "redis_data")
# Container path the storage store is mounted at. Defaults to /var/lib/pulp (the
# image's built-in DEPLOY_ROOT), so the DEPLOY_ROOT/MEDIA_ROOT/... defaults below
# line up with it. Override together with those paths to mount a SHARED PARENT
# once and place DEPLOY_ROOT in a subdir — needed when PulpExport hardlinks the
# artifacts into an export dir that is a SIBLING of the store: both must sit under
# ONE mount, or os.link() fails cross-device (EXDEV). This bites on NFS/EFS, where
# two separate bind mounts of the same export become two mounts (separate
# superblocks) inside the container even though the host sees one filesystem. See
# group_vars/prod.yml for the shared-parent layout.
pulp_storage_mount: /var/lib/pulp
# Host directory under which the DEPLOY_ROOT subdirs (media/tmp/assets/scripts)
# are ensured to exist with the pulp uid/gid. Defaults to the storage bind source,
# which equals DEPLOY_ROOT's host path in the default layout (mount == DEPLOY_ROOT).
# Override when the storage mount root differs from DEPLOY_ROOT (shared-parent
# layout: the store is mounted at a parent and DEPLOY_ROOT lives in a subdir).
pulp_deploy_root_host: "{{ pulp_storage_dir }}"
# Optionally chown the pulp storage bind-mount to the in-container pulp uid/gid.
# Leave false when migrating real data that already has correct ownership.
pulp_storage_set_owner: false
pulp_storage_owner: "700"
pulp_storage_group: "700"
# UID[:GID] the pulp runtime services (api/content/worker + one-shots) run as.
# Defaults to the image's built-in "pulp" user (uid 700). When bind-mounting
# EXISTING data owned by a different uid, set this to that owner so the process
# has native access without chowning the data — and set pulp_storage_owner /
# pulp_storage_group to the same, so the role-managed assets/certs (settings,
# encryption/token keys) remain readable by this user.
pulp_run_user: pulp
# SELinux relabel for the storage bind mount specifically. Defaults to the
# global pulp_selinux_relabel, but override it independently for the common case
# where the host is Enforcing (global stays true) yet storage is on NFS/EFS:
# NFS can't hold per-file SELinux xattrs, so the relabel fails (EOPNOTSUPP) AND
# recursively walks the whole tree on every start. For NFS/EFS, set this false
# and label the mount itself instead, e.g. mount with:
#   context="system_u:object_r:container_file_t:s0"
# (Ignored in named-volume mode; only applies when pulp_storage_dir is set.)
pulp_storage_selinux_relabel: "{{ pulp_selinux_relabel }}"

# ── PulpExport / PulpImport ─────────────────────────────────────────────────
# Filesystem export/import (pulpcore-manager / PulpExport tasks). Disabled when
# pulp_exports_dir is empty. Set it to a host path (e.g. an NFS/EBS mount) to
# enable: the dir is bind-mounted into the api+worker services at
# pulp_export_path, chowned to the in-container pulp uid/gid, and whitelisted in
# settings (ALLOWED_EXPORT_PATHS / ALLOWED_IMPORT_PATHS).
pulp_exports_dir: ""             # host path; "" = export/import not mounted
pulp_export_path: /srv/exports   # path inside the containers
# Same SELinux rule as pulp_storage_selinux_relabel: defaults to the global
# toggle; set false independently when the exports dir is on NFS/EFS and label
# the mount via a context= mount option instead.
pulp_exports_selinux_relabel: "{{ pulp_selinux_relabel }}"
# Whitelisted PulpExport / PulpImport paths, rendered verbatim into settings.py
# (ALLOWED_EXPORT_PATHS / ALLOWED_IMPORT_PATHS). Defaults preserve the previous
# behavior: the single mounted pulp_export_path (when pulp_exports_dir is set)
# plus /tmp, else just /tmp. Override with an explicit list to allow multiple or
# custom paths — every path MUST be readable/writable inside the api+worker
# containers (i.e. backed by a bind mount), or exports/imports fail at runtime.
pulp_allowed_export_paths: "{{ ([pulp_export_path, '/tmp'] if pulp_exports_dir else ['/tmp']) }}"
pulp_allowed_import_paths: "{{ ([pulp_export_path, '/tmp'] if pulp_exports_dir else ['/tmp']) }}"

# ── Package signing (optional) ──────────────────────────────────────────────
# Run a Pulp signing service (signs published metadata/packages). Off by
# default. When enabled you MUST also provide pulp_signing_key_fingerprint and
# import the corresponding GPG key into the pulp keyring; otherwise the
# signing_key_service container fails and the stack never comes up.
pulp_signing_enabled: false
pulp_signing_key_fingerprint: ""

# ── Database / cache ─────────────────────────────────────────────────────
# When true, use an external PostgreSQL (e.g. AWS RDS) and do NOT run the
# bundled postgres container. When false (dev default), Postgres runs in Docker.
pulp_postgres_external: false
# Connection details. For dev the host is the compose service name "postgres".
# For external/RDS, override pulp_postgres_host with the endpoint and tighten ssl.
pulp_postgres_host: postgres
pulp_postgres_port: 5432
# Optional: when set, rendered as DATABASES.default.OPTIONS.sslmode; when left
# undefined the key is omitted and libpq's own default ("prefer") applies.
# For external/RDS set "require" (or "verify-full" with a CA).
# pulp_postgres_sslmode: prefer
pulp_postgres_user: pulp
pulp_postgres_db: pulp
pulp_postgres_password: "changeme-postgres"

# ── App settings ─────────────────────────────────────────────────────────
pulp_secret_key: "CHANGE-ME"
pulp_content_origin: >-
  {{ 'https' if pulp_https | bool else 'http' }}://{{ ansible_fqdn }}:{{ pulp_https_port if pulp_https | bool else pulp_http_port }}
pulp_admin_password: "changeme-please"
# Run the one-shot set_init_password_service, which sets the Pulp admin
# (superuser) password from pulp_admin_password on bring-up. Keep true for a
# fresh install to seed the initial admin. Set false for an EXISTING deployment
# (e.g. migrating with pre-existing RDS data) — the admin already exists and you
# don't want its password reset. When false, pulp_admin_password is unused.
pulp_set_init_password: true

# ── settings.py knobs ────────────────────────────────────────────────────
# Every line rendered into assets/settings.py is driven from here. Defaults
# mirror the production reference; override per-environment in group_vars.
#
# NOTE: the *_host / *_hostname / token_server values below default to the
# compose-internal service names (redis, pulp_api, pulp_content) rather than
# prod's public FQDNs — the multi-container stack talks to itself over the
# compose network. In prod, set pulp_ansible_api_hostname / _content_hostname /
# pulp_token_server to the public https URLs (see group_vars/prod.yml).
pulp_cache_enabled: true
pulp_redis_host: redis
pulp_redis_port: 6379
pulp_redis_password: ""

# Fernet key for symmetrically-encrypted DB fields (path inside the container,
# from the mounted assets/certs dir).
pulp_db_encryption_key_path: /etc/pulp/certs/database_fields.symmetric.key
# How the key file is provisioned on the host:
#   * pulp_db_encryption_key_src set  -> copy that control-node file into place
#     (use this to bring the ORIGINAL key when migrating an existing deployment);
#   * else pulp_generate_db_encryption_key true -> generate a fresh random key
#     (correct only for a NEW deployment with no pre-existing encrypted data).
# A NEW/WRONG key makes already-encrypted DB fields permanently unreadable, so
# for an existing deployment provide the original key and disable generation.
# When generation is off and no key is present, the play fails fast.
pulp_generate_db_encryption_key: true
pulp_db_encryption_key_src: ""
# Optional: persistent DB connection lifetime (seconds). When set, rendered as
# DATABASES.default.CONN_MAX_AGE; when undefined the key is omitted and Django's
# default (0 = close the connection after each request) applies.
# pulp_postgres_conn_max_age: 0

# Internal service endpoints (compose network). Public FQDNs go in group_vars.
pulp_ansible_api_hostname: "http://pulp_api:24817"
pulp_ansible_content_hostname: "http://pulp_content:24816/pulp/content"

# Filesystem layout (container-internal paths under the pulp storage mount).
pulp_deploy_root: /var/lib/pulp
pulp_media_root: /var/lib/pulp/media
pulp_working_directory: /var/lib/pulp/tmp
pulp_file_upload_temp_dir: /var/lib/pulp/tmp
pulp_static_root: /var/lib/pulp/assets
pulp_static_url: /assets/
pulp_content_path_prefix: /pulp/content/

# Content / upload protection windows (minutes) and API app TTL (seconds).
pulp_upload_protection_time: 1440
pulp_tmpfile_protection_time: 1440
pulp_api_app_ttl: 350

pulp_allowed_content_checksums:
  - sha256
pulp_authentication_backends:
  - django.contrib.auth.backends.ModelBackend
  - pulpcore.backends.ObjectRolePermissionBackend

# pulp_container token auth. Prod runs with token auth DISABLED, so the key
# paths below are unused unless you flip pulp_token_auth_disabled to false — in
# which case you must provide the ES256 keypair at these paths.
pulp_token_server: "http://pulp_api:24817/token/"
pulp_token_auth_disabled: true
pulp_token_signature_algorithm: ES256
# Container-internal paths (from the mounted assets/certs dir) that settings.py
# points at.
pulp_token_public_key_path: /etc/pulp/certs/token_public_key.pem
pulp_token_private_key_path: /etc/pulp/certs/token_private_key.pem
# Optional control-node source files for the ES256 keypair. When set, they are
# copied into assets/certs (like the DB encryption key) — use this to bring the
# ORIGINAL keypair when migrating an existing deployment. Left empty, no key
# files are laid down (fine when token auth is disabled).
pulp_token_public_key_src: ""
pulp_token_private_key_src: ""

pulp_analytics: false

# Install the selected container engine (pulp_container_engine) on the host.
# Engine version pinning is left to the distro repo (latest stable). Set false
# if the engine + compose tool are already present.
pulp_install_engine: true

# Bring the container stack up as part of the run. When false, the play still
# installs the engine, renders compose.yml + all assets/settings and (optionally)
# builds the custom image, but does NOT run "compose up", skips the API readiness
# wait, and suppresses the restart handler — so no containers are started or
# recreated. Use it to stage/refresh config on the host and start manually later
# (cd {{ pulp_project_dir }} && {{ pulp_compose_cmd }} -f compose.yml up -d).
pulp_start_stack: true
