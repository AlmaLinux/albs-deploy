---
threads_count: 4
base_work_dir: "/srv/alternatives"
home_dir: "/home/{{ service_user }}"
base_conf_dir: "{{ home_dir }}/.config"
final_conf_dir: "{{ base_conf_dir }}/castor"
service_user: albs-builder
service_group: albs-builder
build_node_working_directory: "{{ home_dir }}/albs"
build_node_venv_directory: "{{ home_dir }}/.builder-venv"
build_node_requirements_path: "{{ build_node_working_directory }}/albs-node/requirements.txt"
pesign_dir_path: "/opt/pesign"
powertools_repository_name: crb
working_directories:
  - "{{ base_work_dir }}"
  - "{{ build_node_working_directory }}"
  - "{{ base_work_dir }}/castor/build_node"
  - "{{ base_work_dir }}/castor/build_node/mock_configs"
  - "{{ final_conf_dir }}"
# albs-node pins grpcio==1.58.0, which has prebuilt wheels only up to
# Python 3.11. Set this per host (e.g. "1.70.0") to replace the pin in
# requirements.txt after cloning, so Python 3.12+ hosts get a wheel instead
# of a source build. Empty (default) keeps the albs-node pin.
build_node_grpcio_version: ""
build_node_wheel_arches:
  - x86_64
  - aarch64
# Architectures without grpcio wheels (s390x, riscv64, ppc64le) build
# requirements from source with the s390x_* build requirements/environment below.
build_node_build_from_source: "{{ ansible_facts['architecture'] not in build_node_wheel_arches }}"
# Source builds run without build isolation:
# grpcio 1.58 setup.py needs pkg_resources (removed in setuptools 81),
# git deps with PEP 621 metadata need setuptools>=61 (system one is 53
# and satisfies a bare "<81" via --system-site-packages),
# cryptography (pulled by google-auth) is a Rust sdist built with maturin
# and needs cffi>=2 (system one is 1.14),
# setuptools >=71 prefers an installed 'packaging' over its vendored copy and
# needs packaging>=24.2 (EL9 system python3-packaging is 20.9, visible via
# --system-site-packages, and fails with canonicalize_version() errors)
build_node_s390x_build_requirements:
  - "packaging>=24.2"
  - "setuptools>=61,<81"
  - "cython<3"
  - "wheel"
  - "maturin>=1.9.4,<2"
  - "cffi>=2.0.0"
build_node_s390x_pip_environment:
  GRPC_PYTHON_BUILD_SYSTEM_OPENSSL: "1"
  GRPC_PYTHON_BUILD_SYSTEM_ZLIB: "1"
  GRPC_PYTHON_BUILD_SYSTEM_CARES: "1"
  GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS: "1"
...
